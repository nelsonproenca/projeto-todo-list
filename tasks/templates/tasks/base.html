{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Foco 3{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tasks/app.css' %}">
</head>
<body>
  <main class="page">
    {% block nav %}
    <nav class="nav">
      <a href="/{% if cansado %}?cansado=1{% endif %}" class="nav-brand">Hoje</a>
      <a href="/depois/{% if cansado %}?cansado=1{% endif %}">Para depois</a>
    </nav>
    {% endblock %}
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li class="message {{ message.tags }}">{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
